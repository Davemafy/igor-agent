<svg xmlns="http://www.w3.org/2000/svg" width="980" height="660" viewBox="0 0 980 660" role="img" aria-labelledby="tt dd"><title id="tt">Taste is a signal, not a fact</title><desc id="dd">A conceptual explanation of Igor provenance rules. Qloo cultural signals are distinct from price, access, timing, and other practical facts.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#12181A"/><stop offset="0.5" stop-color="#0B0E10"/><stop offset="1" stop-color="#060909"/></linearGradient><linearGradient id="aqua" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D8F7F1"/><stop offset="1" stop-color="#81CAC5"/></linearGradient></defs><rect x="0" y="0" width="980" height="660" rx="0" fill="url(#bg)"/><rect x="30" y="30" width="920" height="600" rx="24" fill="none" stroke="#344044" stroke-width="1.5"/><text x="69" y="86" fill="#B7F0E9" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="1.5">01  /  SOURCE-AWARE DISCOVERY</text><text x="67" y="170" fill="#F5F6F2" font-family="Inter, Arial, Helvetica, sans-serif" font-size="57" font-weight="700" letter-spacing="-2.3">Taste is a signal.</text><text x="67" y="230" fill="#F5F6F2" font-family="Inter, Arial, Helvetica, sans-serif" font-size="57" font-weight="700" letter-spacing="-2.3">Not a fact.</text><rect x="67" y="283" width="846" height="111" rx="17" fill="#14191B" stroke="#344044" stroke-width="1"/><circle cx="103" cy="320" r="7" fill="#B7F0E9"/><text x="127" y="328" fill="#B7F0E9" font-family="Inter, Arial, Helvetica, sans-serif" font-size="19" font-weight="700" letter-spacing="1">QLOO CULTURAL SIGNAL</text><text x="102" y="367" fill="#F5F6F2" font-family="Inter, Arial, Helvetica, sans-serif" font-size="20" font-weight="500" letter-spacing="0">Relevant connections between films, artists and places.</text><rect x="67" y="410" width="846" height="116" rx="17" fill="#14191B" stroke="#344044" stroke-width="1"/><circle cx="103" cy="448" r="7" fill="#DDCFB3"/><text x="127" y="454" fill="#DDCFB3" font-family="Inter, Arial, Helvetica, sans-serif" font-size="19" font-weight="700" letter-spacing="1">PRACTICAL REQUIREMENT</text><text x="102" y="491" fill="#F5F6F2" font-family="Inter, Arial, Helvetica, sans-serif" font-size="20" font-weight="500" letter-spacing="0">Price, access and timing require separate evidence.</text><line x1="67" y1="553" x2="914" y2="553" stroke="#344044" stroke-width="1"/><text x="68" y="586" fill="#B7C3C0" font-family="Inter, Arial, Helvetica, sans-serif" font-size="17" font-weight="600" letter-spacing="1.4">EVIDENCE + SOURCE + LIMITATIONS</text><text x="912" y="586" fill="#B7F0E9" font-family="Inter, Arial, Helvetica, sans-serif" font-size="19" font-weight="700" letter-spacing="2" text-anchor="end">IGOR</text></svg>