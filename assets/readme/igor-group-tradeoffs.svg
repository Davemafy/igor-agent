<svg xmlns="http://www.w3.org/2000/svg" width="980" height="660" viewBox="0 0 980 660" role="img" aria-labelledby="tt dd"><title id="tt">Six people, not one taste</title><desc id="dd">A conceptual diagram of Igor group preference attribution: participant preferences remain individually attributed, comparisons use per-query rank and coverage, and unknown is not treated as dislike.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#12181A"/><stop offset="0.5" stop-color="#0B0E10"/><stop offset="1" stop-color="#060909"/></linearGradient><linearGradient id="aqua" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D8F7F1"/><stop offset="1" stop-color="#81CAC5"/></linearGradient></defs><rect x="0" y="0" width="980" height="660" rx="0" fill="url(#bg)"/><rect x="30" y="30" width="920" height="600" rx="24" fill="none" stroke="#344044" stroke-width="1.5"/><text x="69" y="86" fill="#B7F0E9" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="1.5">03  /  GROUP DECISIONS</text><text x="67" y="170" fill="#F5F6F2" font-family="Inter, Arial, Helvetica, sans-serif" font-size="58" font-weight="700" letter-spacing="-2.5">Six people.</text><text x="67" y="231" fill="#F5F6F2" font-family="Inter, Arial, Helvetica, sans-serif" font-size="58" font-weight="700" letter-spacing="-2.5">Not one taste.</text><text x="70" y="283" fill="#B7C3C0" font-family="Inter, Arial, Helvetica, sans-serif" font-size="22" font-weight="400" letter-spacing="0">Participant signals stay separate.</text><rect x="69" y="325" width="843" height="61" rx="13" fill="#14191B" stroke="#344044" stroke-width="1"/><rect x="89" y="340" width="6" height="30" rx="3" fill="#B7F0E9"/><text x="118" y="363" fill="#F5F6F2" font-family="Inter, Arial, Helvetica, sans-serif" font-size="20" font-weight="600" letter-spacing="0.45">PREFERENCES   /   individually attributed</text><rect x="69" y="399" width="843" height="61" rx="13" fill="#14191B" stroke="#344044" stroke-width="1"/><rect x="89" y="414" width="6" height="30" rx="3" fill="#B7F0E9"/><text x="118" y="437" fill="#F5F6F2" font-family="Inter, Arial, Helvetica, sans-serif" font-size="20" font-weight="600" letter-spacing="0.45">RANKS   /   compared inside each query</text><rect x="69" y="473" width="843" height="61" rx="13" fill="#14191B" stroke="#344044" stroke-width="1"/><rect x="89" y="488" width="6" height="30" rx="3" fill="#B7F0E9"/><text x="118" y="511" fill="#F5F6F2" font-family="Inter, Arial, Helvetica, sans-serif" font-size="20" font-weight="600" letter-spacing="0.45">UNKNOWN   /   never treated as dislike</text><line x1="69" y1="552" x2="912" y2="552" stroke="#344044" stroke-width="1"/><text x="69" y="586" fill="#7A8987" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="600" letter-spacing="1">SOURCE: docs/architecture.md</text><text x="913" y="586" fill="#B7F0E9" font-family="Inter, Arial, Helvetica, sans-serif" font-size="19" font-weight="700" letter-spacing="2" text-anchor="end">IGOR</text></svg>