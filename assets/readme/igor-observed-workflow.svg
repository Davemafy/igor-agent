<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850" role="img" aria-labelledby="tt dd"><title id="tt">Igor observed workflow</title><desc id="dd">An illustrated account of an October 26 production check: a Portishead and Arrival prompt produced ten film references with live Qloo evidence; updating the budget preserved the catalogue with zero new Qloo requests. Not an application screenshot.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#12181A"/><stop offset="0.5" stop-color="#0B0E10"/><stop offset="1" stop-color="#060909"/></linearGradient><linearGradient id="aqua" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D8F7F1"/><stop offset="1" stop-color="#81CAC5"/></linearGradient></defs><rect x="0" y="0" width="1600" height="850" rx="0" fill="url(#bg)"/><rect x="34" y="34" width="1532" height="782" rx="28" fill="none" stroke="#344044" stroke-width="1.5"/><text x="82" y="100" fill="#B7F0E9" font-family="Inter, Arial, Helvetica, sans-serif" font-size="21" font-weight="700" letter-spacing="2">IGOR / DOCUMENTED PRODUCT JOURNEY</text><text x="1515" y="100" fill="#B7C3C0" font-family="Inter, Arial, Helvetica, sans-serif" font-size="19" font-weight="600" letter-spacing="2" text-anchor="end">26 OCT 2026</text><text x="82" y="181" fill="#F5F6F2" font-family="Inter, Arial, Helvetica, sans-serif" font-size="76" font-weight="700" letter-spacing="-3">From discovery</text><text x="82" y="262" fill="#F5F6F2" font-family="Inter, Arial, Helvetica, sans-serif" font-size="76" font-weight="700" letter-spacing="-3">to a decision.</text><text x="84" y="303" fill="#B7C3C0" font-family="Inter, Arial, Helvetica, sans-serif" font-size="21" font-weight="400" letter-spacing="0">An actual Railway test, illustrated from its recorded results.</text><line x1="100" y1="349" x2="100" y2="706" stroke="#B7F0E9" stroke-width="3"/><circle cx="100" cy="373" r="9" fill="#B7F0E9"/><circle cx="100" cy="507" r="9" fill="#B7F0E9"/><circle cx="100" cy="658" r="9" fill="#B7F0E9"/><rect x="139" y="342" width="820" height="110" rx="18" fill="#14191B" stroke="#344044" stroke-width="1"/><text x="172" y="374" fill="#B7F0E9" font-family="Inter, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="1.7">01  /  USER REQUEST</text><text x="172" y="408" fill="#F5F6F2" font-family="Inter, Arial, Helvetica, sans-serif" font-size="26" font-weight="600" letter-spacing="0">“I like Portishead and Arrival. Find films</text><text x="172" y="437" fill="#F5F6F2" font-family="Inter, Arial, Helvetica, sans-serif" font-size="26" font-weight="600" letter-spacing="0">for me for a quiet evening.”</text><rect x="139" y="472" width="820" height="114" rx="18" fill="#14191B" stroke="#344044" stroke-width="1"/><text x="172" y="504" fill="#B7F0E9" font-family="Inter, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="1.7">02  /  QLOO-BACKED DISCOVERY</text><text x="172" y="541" fill="#F5F6F2" font-family="Inter, Arial, Helvetica, sans-serif" font-size="30" font-weight="700" letter-spacing="-0.8">10 film references returned</text><text x="172" y="569" fill="#B7C3C0" font-family="Inter, Arial, Helvetica, sans-serif" font-size="20" font-weight="400" letter-spacing="0">Cultural evidence delivered LIVE</text><rect x="139" y="606" width="820" height="106" rx="18" fill="#14191B" stroke="#344044" stroke-width="1"/><text x="172" y="640" fill="#B7F0E9" font-family="Inter, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="1.7">03  /  CORRECTION</text><text x="172" y="680" fill="#F5F6F2" font-family="Inter, Arial, Helvetica, sans-serif" font-size="27" font-weight="600" letter-spacing="0">“Budget: 20”  →  film pool retained</text><line x1="1018" y1="343" x2="1018" y2="713" stroke="#344044" stroke-width="2"/><text x="1064" y="400" fill="#B7F0E9" font-family="Inter, Arial, Helvetica, sans-serif" font-size="127" font-weight="700" letter-spacing="-6">10</text><text x="1255" y="378" fill="#F5F6F2" font-family="Inter, Arial, Helvetica, sans-serif" font-size="21" font-weight="700" letter-spacing="2">FILM</text><text x="1255" y="410" fill="#F5F6F2" font-family="Inter, Arial, Helvetica, sans-serif" font-size="21" font-weight="700" letter-spacing="2">REFERENCES</text><line x1="1052" y1="470" x2="1515" y2="470" stroke="#344044" stroke-width="1.5"/><text x="1060" y="594" fill="#B7F0E9" font-family="Inter, Arial, Helvetica, sans-serif" font-size="127" font-weight="700" letter-spacing="-4">0</text><text x="1228" y="574" fill="#F5F6F2" font-family="Inter, Arial, Helvetica, sans-serif" font-size="21" font-weight="700" letter-spacing="2">NEW QLOO</text><text x="1228" y="604" fill="#F5F6F2" font-family="Inter, Arial, Helvetica, sans-serif" font-size="21" font-weight="700" letter-spacing="2">REQUESTS</text><text x="1063" y="654" fill="#B7C3C0" font-family="Inter, Arial, Helvetica, sans-serif" font-size="19" font-weight="400" letter-spacing="0">during the budget correction</text><line x1="80" y1="757" x2="1516" y2="757" stroke="#344044" stroke-width="1"/><text x="82" y="791" fill="#7A8987" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="500" letter-spacing="1">SOURCE: docs/live-integration.md   /   OBSERVED RUN, NOT A UI SCREENSHOT</text><text x="1515" y="791" fill="#B7F0E9" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="600" letter-spacing="1.4" text-anchor="end">YOUR AGENT WITH TASTE</text></svg>