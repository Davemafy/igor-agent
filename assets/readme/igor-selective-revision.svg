<svg xmlns="http://www.w3.org/2000/svg" width="980" height="660" viewBox="0 0 980 660" role="img" aria-labelledby="tt dd"><title id="tt">Change the budget, keep the research</title><desc id="dd">A sourced editorial graphic for the documented production run where adjusting a budget preserved the film pool and made zero new Qloo requests.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#12181A"/><stop offset="0.5" stop-color="#0B0E10"/><stop offset="1" stop-color="#060909"/></linearGradient><linearGradient id="aqua" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D8F7F1"/><stop offset="1" stop-color="#81CAC5"/></linearGradient></defs><rect x="0" y="0" width="980" height="660" rx="0" fill="url(#bg)"/><rect x="30" y="30" width="920" height="600" rx="24" fill="none" stroke="#344044" stroke-width="1.5"/><text x="69" y="86" fill="#B7F0E9" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="1.5">02  /  SELECTIVE REVISION</text><text x="67" y="170" fill="#F5F6F2" font-family="Inter, Arial, Helvetica, sans-serif" font-size="56" font-weight="700" letter-spacing="-2.2">Change the budget.</text><text x="67" y="230" fill="#F5F6F2" font-family="Inter, Arial, Helvetica, sans-serif" font-size="56" font-weight="700" letter-spacing="-2.2">Keep the research.</text><line x1="67" y1="277" x2="911" y2="277" stroke="#344044" stroke-width="1.4"/><text x="72" y="358" fill="#B7F0E9" font-family="Inter, Arial, Helvetica, sans-serif" font-size="120" font-weight="700" letter-spacing="-5">0</text><text x="252" y="323" fill="#F5F6F2" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="1">NEW QLOO REQUESTS</text><text x="252" y="359" fill="#B7C3C0" font-family="Inter, Arial, Helvetica, sans-serif" font-size="22" font-weight="400" letter-spacing="0">when the budget changed</text><rect x="68" y="419" width="842" height="118" rx="17" fill="#14191B" stroke="#344044" stroke-width="1"/><circle cx="105" cy="460" r="8" fill="#B7F0E9"/><text x="130" y="466" fill="#B7F0E9" font-family="Inter, Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="1">FILM REFERENCE POOL RETAINED</text><text x="104" y="503" fill="#B7C3C0" font-family="Inter, Arial, Helvetica, sans-serif" font-size="19" font-weight="400" letter-spacing="0">Observed during the 26 October Railway production check.</text><line x1="67" y1="552" x2="914" y2="552" stroke="#344044" stroke-width="1"/><text x="68" y="585" fill="#7A8987" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="600" letter-spacing="1">SOURCE: docs/live-integration.md</text><text x="913" y="585" fill="#B7F0E9" font-family="Inter, Arial, Helvetica, sans-serif" font-size="19" font-weight="700" letter-spacing="2" text-anchor="end">IGOR</text></svg>